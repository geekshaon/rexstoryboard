<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Basic Divider Line — Default Variant (Figma Frame)</title>
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <meta name="figma-import-mode" content="component" />
  <meta name="figma-component-width" content="400" />
  <meta name="figma-component-height" content="24" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/torifat/js-bangla-fonts@master/kalpurush.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            kalpurush: ['Kalpurush', 'Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: transparent !important;
      background-color: transparent !important;
      color: #f8fafc;
      font-family: 'Inter', 'Kalpurush', sans-serif;
      margin: 0;
      padding: 0;
      width: 400px;
      position: relative;
      box-sizing: border-box;
    }
    .figma-frame-box {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="figma-frame-box" data-figma-component="basic_divider" data-figma-variant="default" data-figma-name="Basic Divider Line - Default Variant">
    <div class="w-full h-full flex items-center justify-center px-2"><div class="w-full h-0.5 rounded-full" style="background-color:rgba(56, 189, 248, 0.3);box-shadow:0 0 10px #38bdf8"></div></div>
  </div>
</body>
</html>
