<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Footer Card — Progress Tracker Footer (Figma Frame)</title>
  <meta name="viewport" content="width=920, initial-scale=1.0" />
  <meta name="figma-import-mode" content="component" />
  <meta name="figma-component-width" content="920" />
  <meta name="figma-component-height" content="60" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/torifat/js-bangla-fonts@master/kalpurush.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            kalpurush: ['Kalpurush', 'Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: transparent !important;
      background-color: transparent !important;
      color: #f8fafc;
      font-family: 'Inter', 'Kalpurush', sans-serif;
      margin: 0;
      padding: 0;
      width: 920px;
      position: relative;
      box-sizing: border-box;
    }
    .figma-frame-box {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="figma-frame-box" data-figma-component="footer_card" data-figma-variant="progress_bar" data-figma-name="Footer Card - Progress Tracker Footer">
    <div class="w-full h-full flex flex-col justify-center select-none transition-all duration-150 shadow-xl" style="background:rgba(15, 23, 42, 0.9);background-color:rgba(15, 23, 42, 0.9);backdrop-filter:blur(12px);border-top-width:1.5px;border-right-width:1.5px;border-bottom-width:1.5px;border-left-width:1.5px;border-style:solid;border-color:rgba(56, 189, 248, 0.3);border-radius:16px;padding:16px;box-shadow:none"><div class="flex items-center justify-between w-full"><div class="flex items-center gap-2 min-w-0 flex-1 mr-3"><span class="truncate select-none w-full" style="font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;font-size:16px;font-weight:500;color:#38bdf8;text-align:left">বুলিয়ান সমীকরণ: Y = A · B (Y সমান A অ্যান্ড B)</span></div><div class="shrink-0 flex items-center gap-2"><span class="font-mono tracking-wider uppercase inline-flex items-center" style="font-size:12px;font-weight:600;color:#38bdf8;background-color:rgba(15, 23, 42, 0.8);border-color:rgba(51, 65, 85, 0.7);border-width:1px;border-style:solid;border-radius:6px;padding:4px 10px">ধাপ ০১ / ০৪</span></div></div><div class="w-full h-1.5 bg-slate-800/80 rounded-full mt-2 overflow-hidden"><div class="h-full rounded-full transition-all duration-300" style="width:25%;background-color:#38bdf8"></div></div></div>
  </div>
</body>
</html>
