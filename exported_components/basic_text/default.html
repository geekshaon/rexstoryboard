<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Basic Text Block — Default Variant (Figma Frame)</title>
  <meta name="viewport" content="width=360, initial-scale=1.0" />
  <meta name="figma-import-mode" content="component" />
  <meta name="figma-component-width" content="360" />
  <meta name="figma-component-height" content="80" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/torifat/js-bangla-fonts@master/kalpurush.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            kalpurush: ['Kalpurush', 'Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: transparent !important;
      background-color: transparent !important;
      color: #f8fafc;
      font-family: 'Inter', 'Kalpurush', sans-serif;
      margin: 0;
      padding: 0;
      width: 360px;
      position: relative;
      box-sizing: border-box;
    }
    .figma-frame-box {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="figma-frame-box" data-figma-component="basic_text" data-figma-variant="default" data-figma-name="Basic Text Block - Default Variant">
    <div class="w-full h-full flex flex-col justify-center" style="background:rgba(15, 23, 42, 0.9);background-color:rgba(15, 23, 42, 0.9);backdrop-filter:blur(8px);border-top-width:1.5px;border-right-width:1.5px;border-bottom-width:1.5px;border-left-width:1.5px;border-style:solid;border-color:rgba(56, 189, 248, 0.3);border-radius:16px;padding:12px;box-shadow:none"><p style="font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;font-size:24px;font-weight:500;line-height:1.4;color:#f8fafc;text-align:left">একটি সাধারণ টেক্সট বা সাবটাইটেল ব্লক</p></div>
  </div>
</body>
</html>
