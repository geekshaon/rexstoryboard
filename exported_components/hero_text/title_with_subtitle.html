<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Hero Header Block — Title with Subtext (Figma Frame)</title>
  <meta name="viewport" content="width=840, initial-scale=1.0" />
  <meta name="figma-import-mode" content="component" />
  <meta name="figma-component-width" content="840" />
  <meta name="figma-component-height" content="160" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/torifat/js-bangla-fonts@master/kalpurush.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            kalpurush: ['Kalpurush', 'Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: transparent !important;
      background-color: transparent !important;
      color: #f8fafc;
      font-family: 'Inter', 'Kalpurush', sans-serif;
      margin: 0;
      padding: 0;
      width: 840px;
      position: relative;
      box-sizing: border-box;
    }
    .figma-frame-box {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="figma-frame-box" data-figma-component="hero_text" data-figma-variant="title_with_subtitle" data-figma-name="Hero Header Block - Title with Subtext">
    <div class="w-full h-full flex flex-col justify-center items-center transition-all duration-150" style="background:rgba(15, 23, 42, 0.9);background-color:rgba(15, 23, 42, 0.9);backdrop-filter:blur(8px);border-top-width:1.5px;border-right-width:1.5px;border-bottom-width:1.5px;border-left-width:1.5px;border-style:solid;border-color:rgba(56, 189, 248, 0.3);border-radius:16px;padding:24px;box-shadow:none"><h1 class="font-bold tracking-tight leading-tight select-none w-full" style="font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;font-size:38px;font-weight:700;line-height:1.4;color:#f8fafc;text-align:left"><span>ডিজিটাল ইলেকট্রনিক্স ও </span><span style="color:#38bdf8;font-weight:700;text-shadow:0 0 16px #38bdf880;display:inline;transition:all 0.15s ease">অ্যান্ড গেট</span><span> ফান্ডামেন্টালস</span></h1><p class="mt-3 select-none w-full opacity-90 transition-all duration-150" style="font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;font-size:17px;font-weight:400;line-height:1.4;color:#cbd5e1;text-align:left"><span>বিষয়বস্তুর বিস্তারিত বিবরণ বা প্রয়োজনীয় সাবটেক্সট এখানে প্রদর্শন করা হবে</span></p></div>
  </div>
</body>
</html>
