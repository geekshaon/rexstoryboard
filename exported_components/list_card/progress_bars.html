<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Feature & Content List — Progress & Stat Bars (Figma Frame)</title>
  <meta name="viewport" content="width=880, initial-scale=1.0" />
  <meta name="figma-import-mode" content="component" />
  <meta name="figma-component-width" content="880" />
  <meta name="figma-component-height" content="280" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/torifat/js-bangla-fonts@master/kalpurush.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            kalpurush: ['Kalpurush', 'Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: transparent !important;
      background-color: transparent !important;
      color: #f8fafc;
      font-family: 'Inter', 'Kalpurush', sans-serif;
      margin: 0;
      padding: 0;
      width: 880px;
      position: relative;
      box-sizing: border-box;
    }
    .figma-frame-box {
      width: 100%;
      box-sizing: border-box;
      position: relative;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="figma-frame-box" data-figma-component="list_card" data-figma-variant="progress_bars" data-figma-name="Feature & Content List - Progress & Stat Bars">
    <div style="background:rgba(15, 23, 42, 0.9);background-color:rgba(15, 23, 42, 0.9);backdrop-filter:blur(8px);border-top-width:1.5px;border-right-width:1.5px;border-bottom-width:1.5px;border-left-width:1.5px;border-style:solid;border-color:rgba(56, 189, 248, 0.3);border-radius:16px;padding:24px;box-shadow:0 0 12px #38bdf8;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden" class="w-full h-full relative"><div class="mb-3.5 pb-2 border-b border-white/10 shrink-0"><h2 style="color:#f8fafc;font-size:22px;font-weight:700;line-height:1.3;text-align:left;font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif" class="tracking-tight">সেন্ট্রাল প্রসেসিং আর্কিটেকচার</h2></div><div style="gap:12px" class="flex flex-col justify-start"><div style="background-color:rgba(15, 23, 42, 0.65);border-color:rgba(255, 255, 255, 0.08);border-width:1px;border-radius:14px;padding:14px" class="border flex flex-col justify-start transition-all"><div class="flex items-center justify-between gap-3 mb-2"><span style="color:#f8fafc;font-size:16px;font-weight:700;font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;text-align:left" class="truncate leading-tight font-semibold">০১ সেন্ট্রাল প্রসেসিং ইউনিট (CPU)</span><span style="color:#10b981" class="font-mono font-bold text-xs shrink-0 tracking-wide">✓ Done</span></div><div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden border border-white/5"><div style="width:100%;background-color:#10b981;box-shadow:0 0 10px #10b98190" class="h-full rounded-full transition-all duration-300"></div></div></div><div style="background-color:rgba(15, 23, 42, 0.65);border-color:rgba(255, 255, 255, 0.08);border-width:1px;border-radius:14px;padding:14px" class="border flex flex-col justify-start transition-all"><div class="flex items-center justify-between gap-3 mb-2"><span style="color:#f8fafc;font-size:16px;font-weight:700;font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;text-align:left" class="truncate leading-tight font-semibold">০২ মেমরি ইউনিট (RAM &amp; Flash)</span><span style="color:#06b6d4" class="font-mono font-bold text-xs shrink-0 tracking-wide">SPEAKING NOW</span></div><div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden border border-white/5"><div style="width:78%;background-color:#06b6d4;box-shadow:0 0 10px #06b6d490" class="h-full rounded-full transition-all duration-300"></div></div></div><div style="background-color:rgba(15, 23, 42, 0.65);border-color:rgba(255, 255, 255, 0.08);border-width:1px;border-radius:14px;padding:14px" class="border flex flex-col justify-start transition-all"><div class="flex items-center justify-between gap-3 mb-2"><span style="color:#f8fafc;font-size:16px;font-weight:700;font-family:&#x27;Kalpurush&#x27;, &#x27;Hind Siliguri&#x27;, &#x27;Noto Sans Bengali&#x27;, sans-serif;text-align:left" class="truncate leading-tight font-semibold">০৩ ইনপুট/আউটপুট পোর্ট (GPIO Pins)</span><span style="color:#f59e0b" class="font-mono font-bold text-xs shrink-0 tracking-wide">14 Pins</span></div><div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden border border-white/5"><div style="width:42%;background-color:#f59e0b;box-shadow:0 0 10px #f59e0b90" class="h-full rounded-full transition-all duration-300"></div></div></div></div></div>
  </div>
</body>
</html>
